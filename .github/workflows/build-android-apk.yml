name: Build UABEA Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'uabea-android-1.6.0-english-github-actions.zip'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract source ZIP
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip
          unzip -q uabea-android-1.6.0-english-github-actions.zip -d source
          test -f source/uabea-android-1.6.0/UABEA.Android/UABEA.Android.Android/UABEA.Android.Android.csproj

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install .NET Android workload
        run: dotnet workload install android

      - name: Restore Android project
        working-directory: source/uabea-android-1.6.0
        run: dotnet restore UABEA.Android/UABEA.Android.Android/UABEA.Android.Android.csproj

      - name: Build debug APK
        working-directory: source/uabea-android-1.6.0
        run: >-
          dotnet build UABEA.Android/UABEA.Android.Android/UABEA.Android.Android.csproj
          --configuration Debug
          --framework net8.0-android
          --no-restore
          -p:AndroidPackageFormat=apk

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="source/uabea-android-1.6.0/UABEA.Android/UABEA.Android.Android/bin/Debug/net8.0-android"
          APK_PATH="$(find "$APK_DIR" -type f -name '*.apk' -print -quit)"
          test -n "$APK_PATH"
          mkdir -p dist
          cp "$APK_PATH" dist/UABEA-Android-English-debug.apk
          ls -lh dist/UABEA-Android-English-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UABEA-Android-English-debug-APK
          path: dist/UABEA-Android-English-debug.apk
          if-no-files-found: error
          retention-days: 14
          
