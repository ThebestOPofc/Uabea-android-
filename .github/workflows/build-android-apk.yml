name: Build UABEA Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Find and extract UABEA source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          echo "ZIP files found in the repository:"
          find . -maxdepth 3 -type f -iname '*.zip' -print | sort || true

          # Prefer the exact English GitHub Actions archive, then other UABEA archives.
          mapfile -t archives < <(find . -maxdepth 3 -type f -iname '*uabea*english*github*actions*.zip' -print | sort)
          if [ "${#archives[@]}" -eq 0 ]; then
            mapfile -t archives < <(find . -maxdepth 3 -type f -iname '*uabea*english*.zip' -print | sort)
          fi
          if [ "${#archives[@]}" -eq 0 ]; then
            mapfile -t archives < <(find . -maxdepth 3 -type f -iname '*uabea*.zip' -print | sort)
          fi
          if [ "${#archives[@]}" -eq 0 ]; then
            mapfile -t archives < <(find . -maxdepth 3 -type f -iname '*.zip' -print | sort)
          fi

          if [ "${#archives[@]}" -eq 0 ]; then
            echo "::error::No ZIP archive was found. Upload the UABEA ZIP to the repository root, then run this workflow again."
            exit 1
          fi
          if [ "${#archives[@]}" -gt 1 ]; then
            echo "::error::More than one possible ZIP archive was found. Keep only the intended UABEA English ZIP in the repository, or rename it so its name includes 'uabea-english-github-actions'."
            printf '%s\n' "${archives[@]}"
            exit 1
          fi

          archive="${archives[0]}"
          echo "Using archive: $archive"
          unzip -t "$archive"
          mkdir -p source
          unzip -q "$archive" -d source

          project="$(find source -type f -name 'UABEA.Android.Android.csproj' -print -quit)"
          if [ -z "$project" ]; then
            echo "::error::The ZIP was extracted, but UABEA.Android.Android.csproj was not found. The uploaded ZIP may not be the source archive."
            find source -maxdepth 5 -type f | head -100
            exit 1
          fi

          echo "Android project: $project"
          echo "project=$project" >> "$GITHUB_OUTPUT"

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Show build environment
        run: |
          dotnet --info
          java -version
          df -h .
          free -h

      - name: Install .NET Android workload
        run: dotnet workload install android --verbosity minimal

      - name: Restore Android project
        run: dotnet restore "${{ steps.source.outputs.project }}" --verbosity minimal

      - name: Build debug APK
        run: >-
          dotnet build "${{ steps.source.outputs.project }}"
          --configuration Debug
          --framework net8.0-android
          --no-restore
          --verbosity minimal
          -m:1
          -p:AndroidPackageFormat=apk
          -p:UseSharedCompilation=false

      - name: Collect APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          project_dir="$(dirname "${{ steps.source.outputs.project }}")"
          apk_dir="$project_dir/bin/Debug/net8.0-android"
          apk_path="$(find "$apk_dir" -type f -name '*.apk' -print -quit 2>/dev/null || true)"

          if [ -z "$apk_path" ]; then
            echo "::error::Build finished but no APK was found under $apk_dir"
            find "$project_dir/bin" -maxdepth 6 -type f 2>/dev/null | head -100 || true
            exit 1
          fi

          mkdir -p dist
          cp "$apk_path" dist/UABEA-Android-English-debug.apk
          ls -lh dist/UABEA-Android-English-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: UABEA-Android-English-debug-APK
          path: dist/UABEA-Android-English-debug.apk
          if-no-files-found: error
          retention-days: 14
